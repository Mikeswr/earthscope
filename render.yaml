services:
  - type: web
    name: earthscope-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LUMOSX_ALLOWED_ORIGINS
        value: https://lumosx-seven.vercel.app
