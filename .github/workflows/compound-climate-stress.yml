name: Ghana compound hot-dry climate analysis

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First year of the regional analysis archive
        required: true
        default: "1981"
        type: string
      end_year:
        description: Last year of the regional analysis archive
        required: true
        default: "2025"
        type: string
      minimum_cell_coverage:
        description: Minimum valid monthly coverage required for every grid cell
        required: true
        default: "0.80"
        type: string

permissions:
  contents: read

concurrency:
  group: earthscope-ghana-compound-analysis
  cancel-in-progress: false

jobs:
  fetch-validate-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out EarthScope
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scientific analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels requests pyyaml python-dotenv shapely

      - name: Retrieve native-grid NASA POWER monthly data
        run: |
          python -m scripts.fetch_power_regional \
            --variables T2M,PRECTOTCORR \
            --start "${{ inputs.start_year }}" \
            --end "${{ inputs.end_year }}" \
            --output-dir /tmp/earthscope-nasa-power

      - name: Validate regional data before analysis
        run: |
          python -m scripts.validate_regional_grid \
            --input-dir /tmp/earthscope-nasa-power \
            --variables T2M,PRECTOTCORR \
            --start "${{ inputs.start_year }}" \
            --end "${{ inputs.end_year }}" \
            --minimum-cell-coverage "${{ inputs.minimum_cell_coverage }}" \
            --output /tmp/earthscope-nasa-power/regional_validation.json

      - name: Run compound heat and dryness analysis
        run: |
          python -m scripts.run_compound_analysis \
            --input-dir /tmp/earthscope-nasa-power \
            --output-dir reports/compound_hot_dry \
            --start "${{ inputs.start_year }}" \
            --end "${{ inputs.end_year }}"

      - name: Upload source data, quality report and scientific outputs
        uses: actions/upload-artifact@v4
        with:
          name: earthscope-ghana-compound-hot-dry-${{ inputs.start_year }}-${{ inputs.end_year }}
          path: |
            /tmp/earthscope-nasa-power/
            reports/compound_hot_dry/
          if-no-files-found: error
          retention-days: 90
