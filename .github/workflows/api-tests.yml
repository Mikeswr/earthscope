name: EarthScope API tests

on:
  push:
    branches:
      - main
      - feature/lumosx-api-foundation
  pull_request:
    branches:
      - main
      - feature/lumosx-api-foundation

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1.0" "uvicorn[standard]>=0.30,<1.0" "httpx>=0.27,<1.0" pandas pyyaml python-dotenv pytest
      - name: Compile API module
        run: python -m compileall -q api
      - name: Run API endpoint tests
        run: python -m pytest -q tests/test_api.py
