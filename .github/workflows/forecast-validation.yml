name: Real-data forecast validation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/validate_forecasts.py"
      - "forecasting/**"
      - ".github/workflows/forecast-validation.yml"
      - "data/processed/power_monthly_standardised.csv"

permissions:
  contents: read

jobs:
  validate-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels tabulate
      - name: Validate forecasts on committed NASA POWER data
        run: python scripts/validate_forecasts.py
      - name: Upload validation report and forecasts
        uses: actions/upload-artifact@v4
        with:
          name: earthscope-real-data-forecast-validation
          path: reports/forecast_validation/
          if-no-files-found: error
          retention-days: 30
