name: Dashboard code and data smoke test

on:
  push:
    paths:
      - "dashboard/app.py"
      - "data/spatial/imerg/earthscope_ghana_imerg_monthly_power_support_1998_2025_09.csv"
      - ".github/workflows/dashboard-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile dashboard
        run: python -m py_compile dashboard/app.py
      - name: Verify paired rainfall dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/spatial/imerg/earthscope_ghana_imerg_monthly_power_support_1998_2025_09.csv")
          if not path.is_file():
              raise SystemExit(f"Missing deployed dashboard dataset: {path}")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              fields = set(reader.fieldnames or [])
              required = {"date", "cell_id", "latitude", "longitude", "precipitation_mean", "precipitation_count"}
              missing = required.difference(fields)
              if missing:
                  raise SystemExit(f"Missing required IMERG columns: {sorted(missing)}")
              rows = sum(1 for _ in reader)
          if rows != 20313:
              raise SystemExit(f"Expected 20,313 paired cell-months, found {rows}")
          print(f"Verified {rows:,} paired cell-month records.")
          PY
