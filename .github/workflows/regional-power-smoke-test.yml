name: NASA POWER regional grid smoke test

on:
  push:
    paths:
      - "spatial/power_regional.py"
      - "scripts/fetch_power_regional.py"
      - ".github/workflows/regional-power-smoke-test.yml"
  workflow_dispatch:

jobs:
  regional-grid-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install regional ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyyaml python-dotenv
      - name: Fetch a short real NASA POWER regional sample
        run: |
          python -m scripts.fetch_power_regional --variables T2M --start 2020 --end 2021 --output-dir /tmp/earthscope-regional-smoke
      - name: Validate real regional sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("/tmp/earthscope-regional-smoke")
          csv_path = root / "ghana_power_regional_T2M.csv"
          meta_path = root / "fetch_metadata.json"
          assert csv_path.exists(), "Regional CSV was not created"
          assert meta_path.exists(), "Fetch metadata was not created"
          frame = pd.read_csv(csv_path)
          required = {"date", "variable", "value", "latitude", "longitude", "cell_id", "unit", "source", "data_kind"}
          assert required.issubset(frame.columns), f"Missing columns: {required - set(frame.columns)}"
          assert frame["cell_id"].nunique() > 1, "Regional request returned fewer than two unique grid cells"
          assert frame["date"].notna().all(), "Missing dates in regional output"
          assert frame["latitude"].between(4.7, 11.2).all(), "Latitude outside Ghana request bounds"
          assert frame["longitude"].between(-3.3, 1.3).all(), "Longitude outside Ghana request bounds"
          metadata = json.loads(meta_path.read_text())
          assert metadata["variables"]["T2M"]["request_count"] >= 1
          print(f"Validated {len(frame):,} real monthly cell records across {frame.cell_id.nunique():,} cells.")
          print(json.dumps(metadata["variables"]["T2M"]["grid_spacing"], indent=2))
          PY
      - name: Upload smoke-test data and provenance
        uses: actions/upload-artifact@v4
        with:
          name: nasa-power-regional-smoke-test
          path: /tmp/earthscope-regional-smoke/
          if-no-files-found: error
