name: Forecasting tests

on:
  push:
    paths:
      - "forecasting/**"
      - "tests/test_forecasting.py"
      - ".github/workflows/forecasting-tests.yml"
  pull_request:
    paths:
      - "forecasting/**"
      - "tests/test_forecasting.py"
      - ".github/workflows/forecasting-tests.yml"

jobs:
  forecast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install forecasting test dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels pytest
      - name: Run forecasting tests
        run: python -m pytest -q tests/test_forecasting.py
