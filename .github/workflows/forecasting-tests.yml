name: Forecasting tests and real-data validation

on:
  push:
    paths:
      - "forecasting/**"
      - "scripts/validate_forecasts.py"
      - "tests/test_forecasting.py"
      - "data/processed/power_monthly_standardised.csv"
      - ".github/workflows/forecasting-tests.yml"
  pull_request:
    paths:
      - "forecasting/**"
      - "scripts/validate_forecasts.py"
      - "tests/test_forecasting.py"
      - "data/processed/power_monthly_standardised.csv"
      - ".github/workflows/forecasting-tests.yml"
  workflow_dispatch:

jobs:
  forecast-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install forecasting dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy statsmodels pytest tabulate pyyaml python-dotenv
      - name: Run forecasting unit tests
        run: python -m pytest -q tests/test_forecasting.py
      - name: Run multi-horizon validation on committed NASA POWER data
        run: python scripts/validate_forecasts.py
      - name: Upload validation report and prediction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: earthscope-forecast-validation
          path: reports/forecast_validation/
          if-no-files-found: error
