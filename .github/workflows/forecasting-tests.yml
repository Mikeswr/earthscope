name: Forecasting tests and real-data validation

on:
  push:
    paths:
      - "forecasting/**"
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      - "spatial/**"
      - "ingest/**"
      - "trends/**"
      - "config.py"
      - "locations.yaml"
      - "requirements.txt"
      - "data/processed/power_monthly_standardised.csv"
      - ".github/workflows/forecasting-tests.yml"
  pull_request:
    paths:
      - "forecasting/**"
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      - "ingest/**"
      - "trends/**"
      - "config.py"
      - "locations.yaml"
      - "requirements.txt"
      - "data/processed/power_monthly_standardised.csv"
      - ".github/workflows/forecasting-tests.yml"
  workflow_dispatch:

jobs:
  forecast-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt tabulate
      - name: Compile all project Python modules
        run: python -m compileall -q dashboard scripts spatial trends forecasting ingest qc

      - name: Smoke-test compound analysis command-line entry point
        run: python -m scripts.run_compound_analysis --help
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run multi-horizon validation on committed NASA POWER data
        run: python scripts/validate_forecasts.py
      - name: Upload validation report and prediction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: earthscope-forecast-validation
          path: reports/forecast_validation/
          if-no-files-found: error
